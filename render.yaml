services:
  - type: web
    name: chip-backend
    env: node
    region: oregon
    plan: free
    # Pre-install PlatformIO CLI + the entire ESP32 toolchain during deploy
    # so compilation requests from Claude are instant (~10-15s) with zero cold downloads.
    buildCommand: pip install platformio && pio pkg install -g -p espressif32 && npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_USERNAME
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
