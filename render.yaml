services:
  - type: web
    name: chip-backend
    env: node
    region: oregon
    plan: free
    # Install PlatformIO (the ESP32 compile toolchain) alongside Node deps.
    # pio.exe will be in the system PATH on Render's Linux build machines.
    # The ESP32 toolchain itself (~500 MB) is downloaded by PlatformIO on the
    # first compile and cached in ~/.platformio — it persists for the life of
    # the dyno (gone on redeploy/restart, re-downloads automatically).
    buildCommand: pip install platformio && npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_USERNAME
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
